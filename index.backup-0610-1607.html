<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山夏.Skill — 私人灵感档案</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- 水彩流体显影引擎（本地文件，零依赖） -->
  <script src="./watercolor-fluid.js"></script>

  <style id="design-tokens">
    :root {
      --bg-base: #f1ece1;
      --bg-deep: #e8e0cf;
      --ink-primary: #1a1612;
      --ink-secondary: #5a4f3f;
      --ink-faded: #8a7d68;
      --ink-line: rgba(26, 22, 18, 0.18);
      --accent: #8b3a1f;
      --accent-soft: rgba(139, 58, 31, 0.08);
      --paper-grain: rgba(26, 22, 18, 0.025);
      --serif-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
      --serif-body: 'Noto Serif SC', 'Cormorant Garamond', serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --scale: 1;
      --rhythm: 1;
    }

    [data-mode="night"] {
      --bg-base: #14110d;
      --bg-deep: #0e0c09;
      --ink-primary: #ece4d3;
      --ink-secondary: #b8ab94;
      --ink-faded: #6e6450;
      --ink-line: rgba(236, 228, 211, 0.16);
      --accent: #d4a574;
      --accent-soft: rgba(212, 165, 116, 0.1);
      --paper-grain: rgba(236, 228, 211, 0.02);
    }

    .photo-stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      color: #f5efe2;
    }
    .photo-stage .photo-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
      transition: filter 0.6s ease, transform 8s ease;
    }
    .photo-stage:hover .photo-bg { transform: scale(1.03); }
    .photo-stage .photo-veil {
      position: absolute;
      inset: 0;
      z-index: -1;
      backdrop-filter: blur(var(--veil-blur, 14px));
      -webkit-backdrop-filter: blur(var(--veil-blur, 14px));
      background: linear-gradient(180deg,
        rgba(12,10,8, var(--veil-top, 0.42)) 0%,
        rgba(12,10,8, var(--veil-mid, 0.32)) 45%,
        rgba(12,10,8, var(--veil-bot, 0.55)) 100%);
      transition: backdrop-filter 0.4s ease, background 0.4s ease;
    }
    .photo-stage .photo-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(245, 239, 226, 0.65);
      padding: 6px 10px;
      border: 1px solid rgba(245, 239, 226, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 3;
    }
    .photo-stage .photo-credit {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(245, 239, 226, 0.55);
      z-index: 3;
    }
    .photo-stage .chapter-tag,
    .photo-stage .photo-stage-ink { color: rgba(245, 239, 226, 0.78); }

    [data-veil="clear"] {
      --veil-blur: 4px;
      --veil-top: 0.28;
      --veil-mid: 0.18;
      --veil-bot: 0.42;
    }
    [data-veil="soft"] {
      --veil-blur: 14px;
      --veil-top: 0.42;
      --veil-mid: 0.32;
      --veil-bot: 0.55;
    }
    [data-veil="deep"] {
      --veil-blur: 26px;
      --veil-top: 0.6;
      --veil-mid: 0.52;
      --veil-bot: 0.72;
    }

    .replace-hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 3;
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245, 239, 226, 0.5);
      border: 1px dashed rgba(245, 239, 226, 0.35);
      padding: 5px 9px;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--ink-primary);
      font-family: var(--serif-body);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      transition: background 0.6s ease, color 0.6s ease;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(var(--paper-grain) 1px, transparent 1px),
        radial-gradient(var(--paper-grain) 1px, transparent 1px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      pointer-events: none;
      z-index: 1;
    }
    #root { position: relative; z-index: 2; }

    .serif-display { font-family: var(--serif-display); font-weight: 400; }
    .serif-body { font-family: var(--serif-body); }
    .sans { font-family: var(--sans); }

    .vrule { width: 1px; background: var(--ink-line); }
    .hrule { height: 1px; background: var(--ink-line); width: 100%; }

    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s cubic-bezier(.22,.61,.36,1), transform 1.2s cubic-bezier(.22,.61,.36,1);
    }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    .verse-line {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .verse-line.visible { opacity: 1; transform: translateY(0); }

    .ink-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ink-line) 20%, var(--ink-line) 80%, transparent);
    }

    .tweaks-popup {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 9999;
      background: rgba(255, 252, 245, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(26, 22, 18, 0.12);
      border-radius: 4px;
      padding: 14px 16px;
      width: 248px;
      font-family: var(--sans);
      font-size: 11px;
      color: #1a1612;
      box-shadow: 0 18px 50px -20px rgba(26, 22, 18, 0.25);
    }
    [data-mode="night"] .tweaks-popup {
      background: rgba(20, 17, 13, 0.92);
      border-color: rgba(236, 228, 211, 0.12);
      color: #ece4d3;
    }
    .tweaks-popup h4 {
      margin: 0 0 12px 0;
      font-size: 10px;
      letter-spacing: 0.22em;
      font-weight: 500;
      text-transform: uppercase;
      opacity: 0.55;
    }
    .tweak-row { margin-bottom: 11px; }
    .tweak-row:last-child { margin-bottom: 0; }
    .tweak-row label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 6px;
    }
    .tweak-options { display: flex; gap: 4px; }
    .tweak-options button {
      flex: 1;
      padding: 5px 6px;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 2px;
      font-size: 10px;
      cursor: pointer;
      color: inherit;
      opacity: 0.5;
      font-family: var(--sans);
      transition: all 0.18s ease;
    }
    .tweak-options button:hover { opacity: 0.85; }
    .tweak-options button.active {
      opacity: 1;
      background: currentColor;
    }
    .tweak-options button.active span { color: var(--bg-base); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .loading-dot { animation: pulse-dot 1.6s ease-in-out infinite; }

    /* hover cards */
    .perk-card {
      transition: transform 0.5s cubic-bezier(.22,.61,.36,1), background 0.4s ease;
    }
    .perk-card:hover {
      transform: translateY(-4px);
      background: var(--accent-soft);
    }
    .perk-card:hover .perk-numeral { color: var(--accent); }

    .perk-numeral {
      transition: color 0.4s ease, letter-spacing 0.4s ease;
    }

    .scroll-cue {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      writing-mode: vertical-rl;
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--ink-faded);
      opacity: 0.7;
      z-index: 50;
      pointer-events: none;
    }

    .chapter-tag {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--ink-faded);
    }

    .title-mark {
      display: inline-block;
      width: 38px;
      height: 1px;
      background: currentColor;
      vertical-align: middle;
      margin: 0 14px;
      opacity: 0.5;
    }

    /* ========== 摄影业务模块样式 ========== */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 80;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px clamp(20px, 4vw, 56px);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      background: rgba(241, 236, 225, 0);
      border-bottom: 1px solid transparent;
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
      color: rgba(245, 239, 226, 0.92);
    }
    .topnav.solid {
      background: rgba(241, 236, 225, 0.88);
      border-bottom-color: var(--ink-line);
      color: var(--ink-primary);
    }
    [data-mode="night"] .topnav.solid { background: rgba(20, 17, 13, 0.9); }
    .topnav a {
      color: inherit; text-decoration: none;
      font-family: var(--sans); font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase;
      opacity: 0.78; transition: opacity 0.2s ease, color 0.2s ease;
    }
    .topnav a:hover { opacity: 1; color: var(--accent); }
    .topnav .brand {
      font-family: var(--serif-display); font-size: 22px;
      letter-spacing: -0.01em; font-weight: 400;
    }
    .topnav .brand em { color: var(--accent); font-style: italic; font-weight: 300; }
    .topnav-links { display: flex; gap: 26px; align-items: center; }
    @media (max-width: 880px) { .topnav-links { display: none; } }
    .nav-cta {
      border: 1px solid currentColor; padding: 8px 16px;
      font-size: 10px; letter-spacing: 0.24em; cursor: pointer;
      background: transparent; color: inherit; font-family: var(--sans);
      text-transform: uppercase; transition: all 0.25s ease;
    }
    .nav-cta:hover { background: var(--accent); border-color: var(--accent); color: #fbf6ea; }

    .biz-section {
      padding: clamp(70px, 10vw, 140px) clamp(28px, 4vw, 56px);
      border-top: 1px solid var(--ink-line);
      background: var(--bg-base);
    }
    .biz-section.deep { background: var(--bg-deep); }
    .biz-inner { max-width: 1240px; margin: 0 auto; }
    .biz-eyebrow {
      font-family: var(--sans); font-size: 11px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
    }
    .biz-title {
      font-family: var(--serif-display); font-weight: 400;
      font-size: clamp(34px, 5vw, 64px); line-height: 1.08;
      letter-spacing: -0.015em; margin: 0 0 18px;
    }
    .biz-title em { color: var(--accent); font-style: italic; }
    .biz-lede {
      font-size: clamp(15px, 1.2vw, 18px); color: var(--ink-secondary);
      line-height: 1.95; max-width: 640px;
    }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 32px 0 36px; }
    .filter-bar button {
      background: transparent; border: 1px solid var(--ink-line);
      padding: 9px 18px; font-family: var(--sans); font-size: 11px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-secondary); cursor: pointer; border-radius: 999px;
      transition: all 0.25s ease;
    }
    .filter-bar button:hover { color: var(--accent); border-color: var(--accent); }
    .filter-bar button.active {
      background: var(--ink-primary); color: var(--bg-base);
      border-color: var(--ink-primary);
    }
    .filter-bar button .count { opacity: 0.5; margin-left: 6px; font-size: 9px; }
    .masonry { column-count: 3; column-gap: 18px; }
    @media (max-width: 980px) { .masonry { column-count: 2; } }
    @media (max-width: 560px) { .masonry { column-count: 1; } }
    .work-card {
      break-inside: avoid; margin-bottom: 18px; position: relative;
      overflow: hidden; cursor: pointer; background: var(--bg-deep);
    }
    .work-card img {
      width: 100%; display: block;
      transition: transform 0.8s cubic-bezier(.22,.61,.36,1), filter 0.5s ease;
      filter: saturate(0.92);
    }
    .work-card:hover img { transform: scale(1.04); filter: saturate(1.05); }
    .work-card .meta {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 18px 18px 16px;
      background: linear-gradient(180deg, transparent, rgba(12,10,8,0.78));
      color: #fbf6ea; opacity: 0; transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.4s ease;
    }
    .work-card:hover .meta { opacity: 1; transform: translateY(0); }
    .work-card .meta h4 {
      margin: 0 0 4px; font-family: var(--serif-display);
      font-size: 19px; font-style: italic; font-weight: 400;
    }
    .work-card .meta span {
      font-family: var(--sans); font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; opacity: 0.75;
    }

    .ba-stack { display: grid; gap: 28px; }
    @media (min-width: 880px) { .ba-stack { grid-template-columns: repeat(3, 1fr); } }
    .ba-card { border: 1px solid var(--ink-line); background: var(--bg-base); }
    .ba-frame {
      position: relative; aspect-ratio: 4/5; overflow: hidden;
      user-select: none; cursor: ew-resize;
    }
    .ba-frame img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .ba-frame .ba-after-wrap { position: absolute; inset: 0; overflow: hidden; }
    .ba-handle {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: rgba(251,246,234,0.92); pointer-events: none;
      box-shadow: 0 0 18px rgba(0,0,0,0.35);
    }
    .ba-handle::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 36px; height: 36px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(251,246,234,0.95);
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }
    .ba-handle::after {
      content: '◀ ▶'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); font-size: 9px;
      letter-spacing: 0.1em; color: var(--ink-primary);
    }
    .ba-tag-before, .ba-tag-after {
      position: absolute; top: 14px; padding: 4px 9px;
      font-family: var(--sans); font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase; color: #fbf6ea;
      background: rgba(12,10,8,0.55); backdrop-filter: blur(6px);
    }
    .ba-tag-before { left: 14px; }
    .ba-tag-after { right: 14px; }
    .ba-card .ba-foot { padding: 18px 20px 22px; border-top: 1px solid var(--ink-line); }
    .ba-card .ba-foot h4 {
      margin: 0 0 6px; font-family: var(--serif-display);
      font-size: 22px; font-style: italic; font-weight: 400;
    }
    .ba-card .ba-foot p {
      margin: 0; font-size: 13.5px; color: var(--ink-secondary); line-height: 1.8;
    }

    .about-grid {
      display: grid; grid-template-columns: 1fr; gap: clamp(28px, 5vw, 60px);
      align-items: start;
    }
    @media (min-width: 880px) { .about-grid { grid-template-columns: 5fr 7fr; } }
    .about-portrait {
      position: relative; aspect-ratio: 4/5; overflow: hidden;
      background: var(--bg-deep);
    }
    .about-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.85) contrast(1.02); }
    .about-portrait .badge {
      position: absolute; left: -14px; bottom: 22px;
      background: var(--accent); color: #fbf6ea;
      padding: 10px 16px; font-family: var(--sans);
      font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
    }
    .about-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--ink-line); margin-top: 32px;
    }
    .about-stats > div { padding: 22px 8px 4px; border-right: 1px solid var(--ink-line); }
    .about-stats > div:last-child { border-right: none; }
    .about-stats .num {
      font-family: var(--serif-display); font-size: clamp(34px, 4vw, 48px);
      font-style: italic; color: var(--accent); line-height: 1;
    }
    .about-stats .lbl {
      font-family: var(--sans); font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--ink-faded); margin-top: 8px;
    }

    .pkg-grid { display: grid; gap: 22px; margin-top: 36px; }
    @media (min-width: 880px) { .pkg-grid { grid-template-columns: repeat(3, 1fr); } }
    .pkg-card {
      border: 1px solid var(--ink-line); background: var(--bg-base);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.4s ease, border-color 0.4s ease;
      position: relative;
    }
    .pkg-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .pkg-card.recommended { border-color: var(--accent); }
    .pkg-card.recommended::before {
      content: '推荐 · MOST CHOSEN'; position: absolute; top: 14px; right: -34px;
      background: var(--accent); color: #fbf6ea; padding: 4px 36px;
      font-family: var(--sans); font-size: 9px; letter-spacing: 0.24em;
      transform: rotate(38deg); z-index: 3;
    }
    .pkg-cover { aspect-ratio: 16/10; overflow: hidden; }
    .pkg-cover img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.9); }
    .pkg-body { padding: 24px 26px 28px; display: flex; flex-direction: column; flex: 1; }
    .pkg-body h3 {
      margin: 0 0 6px; font-family: var(--serif-display);
      font-size: 26px; font-style: italic; font-weight: 400;
    }
    .pkg-best {
      font-family: var(--sans); font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-faded);
    }
    .pkg-price {
      display: flex; align-items: baseline; gap: 8px;
      margin: 18px 0 22px; padding-bottom: 18px;
      border-bottom: 1px dashed var(--ink-line);
    }
    .pkg-price .p {
      font-family: var(--serif-display); font-size: 36px;
      color: var(--ink-primary); font-weight: 400;
    }
    .pkg-price .u {
      font-family: var(--sans); font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--ink-faded);
    }
    .pkg-price .d {
      margin-left: auto; font-family: var(--sans); font-size: 11px;
      color: var(--ink-secondary);
    }
    .pkg-timeline { margin: 0 0 22px; padding: 0; list-style: none; }
    .pkg-timeline li {
      display: flex; gap: 14px; padding: 8px 0;
      border-bottom: 1px solid var(--ink-line);
      font-size: 13.5px; color: var(--ink-secondary);
    }
    .pkg-timeline li:last-child { border-bottom: none; }
    .pkg-timeline .t {
      font-family: var(--sans); font-size: 10px; letter-spacing: 0.16em;
      color: var(--accent); flex-shrink: 0; width: 60px; padding-top: 2px;
    }
    .pkg-delivery {
      font-size: 12.5px; color: var(--ink-faded); margin: 0 0 22px;
      font-family: var(--sans);
    }
    .pkg-cta {
      margin-top: auto; padding: 13px; text-align: center;
      background: transparent; border: 1px solid var(--ink-primary);
      color: var(--ink-primary); font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s ease;
    }
    .pkg-cta:hover { background: var(--ink-primary); color: var(--bg-base); }
    .pkg-card.recommended .pkg-cta {
      background: var(--accent); color: #fbf6ea; border-color: var(--accent);
    }
    .pkg-card.recommended .pkg-cta:hover { background: transparent; color: var(--accent); }

    .voice-grid {
      display: grid; gap: 20px; margin-top: 36px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .voice-card {
      padding: 28px 26px; border: 1px solid var(--ink-line);
      background: var(--bg-base); transition: transform 0.4s ease;
    }
    .voice-card:hover { transform: translateY(-3px); }
    .voice-card .quote {
      font-family: var(--serif-display); font-size: 64px;
      line-height: 0.6; color: var(--accent); margin-bottom: 8px;
      font-style: italic; opacity: 0.7;
    }
    .voice-card .body {
      font-size: 14.5px; color: var(--ink-primary); line-height: 1.85;
      min-height: 110px;
    }
    .voice-card .who {
      display: flex; align-items: center; gap: 12px; margin-top: 18px;
      padding-top: 16px; border-top: 1px dashed var(--ink-line);
    }
    .voice-card .who img {

    /* === HELPERS === */
    function useReveal(initial = false) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(initial);
      useEffect(() => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        if (rect.top < window.innerHeight && rect.bottom > 0) {
          setVisible(true);
          return;
        }
        const ob = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { setVisible(true); ob.disconnect(); } });
        }, { threshold: 0.08 });
        ob.observe(ref.current);
        return () => ob.disconnect();
      }, []);
      return [ref, visible];
    }

              key={i}
              className={`verse-line ${visible ? 'visible' : ''}`}
              style={{
                transitionDelay: `${baseDelay + i * 220}ms`,
                fontSize: 'clamp(16px, 1.45vw, 21px)',
                lineHeight: 1.95,
                letterSpacing: '0.04em',
                color: 'var(--ink-primary)',

        </div>
      );
    }

      if (hidden) return null;

      const opts = {
        mode: [['day', '日'], ['night', '夜']],

    function FluidVeil({ src, primary = false }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.WatercolorFX || !ref.current) return;
        const fx = WatercolorFX.init({
          canvas: ref.current,
          image: src,
          MODE: 'reveal',                 // 透明画布上"显影"出清晰照片
          PALETTE: ['#8b3a1f', '#b0764f', '#d4a574', '#5a4f3f'],  // 取自页面 accent/赭石色系
          DENSITY_DISSIPATION: 0.6,
          VELOCITY_DISSIPATION: 1.7,
          CURL: 5,
          SPLAT_RADIUS: 0.22,
          SPLAT_FORCE: 5400,
          CLICK_SPLATS: 14,
          INK_STRENGTH: 0.45,
          EDGE_DARKEN: 0.28,
          REVEAL_LOW: 0.05,
          REVEAL_HIGH: 0.55,
          CUSTOM_CURSOR: primary,         // 只在首屏实例上挂自定义光标
          CURSOR_HOVER_SELECTOR: 'a, button, [data-cursor], .replace-hint, .float-cta'
        });
        let ob;
        if (fx.supported) {
          // 不在视口内的屏暂停模拟，三屏同存也不掉帧
          ob = new IntersectionObserver(
            es => es.forEach(e => (e.isIntersecting ? fx.resume() : fx.pause())),
            { threshold: 0.02 }
          );
          ob.observe(ref.current);
        }
        return () => { if (ob) ob.disconnect(); fx.destroy(); };
      }, [src, primary]);
      return (
        <canvas
          ref={ref}
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', zIndex: 0, pointerEvents: 'none' }}
        />
      );
    }

    /* === BEFORE / AFTER === */
    function BeforeAfter({ item }) {
      const [pos, setPos] = useState(50);
      const frameRef = useRef(null);
      function move(clientX) {
        const rect = frameRef.current.getBoundingClientRect();
        const next = ((clientX - rect.left) / rect.width) * 100;
        setPos(Math.max(2, Math.min(98, next)));
      }
      return (
        <div className="ba-card">
          <div
            className="ba-frame"
            ref={frameRef}
            onMouseMove={e => e.buttons === 1 && move(e.clientX)}
            onMouseDown={e => move(e.clientX)}
            onTouchMove={e => move(e.touches[0].clientX)}
          >
            <img src={item.before} alt="原片" />
            <div className="ba-after-wrap" style={{ width: `${pos}%` }}>
              <img src={item.after} alt="成片" style={{ width: `${100 * 100 / pos}%`, maxWidth: 'none' }} />
            </div>
            <span className="ba-tag-before">原片 · RAW</span>
            <span className="ba-tag-after">成片 · FINAL</span>
            <div className="ba-handle" style={{ left: `${pos}%` }} />
          </div>
          <div className="ba-foot">
            <h4>{item.title}</h4>
            <p>{item.note}</p>
          </div>
        </div>
      );
    }

      useEffect(() => {

        let id = setInterval(() => {

            return p + 1;

        }, 38);
        return () => clearInterval(id);
      }, [visible]);

          id="archive"
          ref={ref}
          style={{
            padding: 'clamp(60px, 10vw, 140px) clamp(28px, 4vw, 56px)',
            borderTop: '1px solid var(--ink-line)',
            background: 'var(--bg-base)'
          }}
        >
          <div className={`fade-in ${visible ? 'visible' : ''}`} style={{ maxWidth: 880, margin: '0 auto', textAlign: 'center' }}>
            <div className="chapter-tag mb-6" style={{ color: 'var(--ink-faded)' }}>
              <span className="loading-dot">●</span>&nbsp;&nbsp;LOADING&nbsp;·&nbsp;加载中
            </div>
            <h3 className="serif-display" style={{
              fontSize: 'clamp(40px, 6vw, 88px)',
              lineHeight: 1.05,
              margin: '0 0 22px',
              letterSpacing: '-0.01em',
              fontStyle: 'italic',
              fontWeight: 400
            }}>
              私人灵感档案
            </h3>
            <p style={{ fontSize: 'clamp(15px, 1.2vw, 18px)', color: 'var(--ink-secondary)', maxWidth: 620, margin: '0 auto', lineHeight: 1.9 }}>
              进入你的作品档案，探索文字、影像、声音与地图体验。
              <br/>每一个角落都为一种感官而设，每一种感官都通往同一个房间。
            </p>

            <div className="mt-12 mx-auto" style={{ maxWidth: 520 }}>
              <div style={{ height: 1, background: 'var(--ink-line)', position: 'relative', overflow: 'hidden' }}>
                <div style={{
                  position: 'absolute', left: 0, top: 0, bottom: 0,
                  width: `${pct}%`,
                  background: 'var(--accent)',
                  transition: 'width 0.4s ease'
                }} />
              </div>
              <div className="flex justify-between mt-3 chapter-tag" style={{ color: 'var(--ink-faded)' }}>
                <span>0%</span>
                <span style={{ color: 'var(--accent)' }}>{pct}% — 正在装订</span>
                <span>100%</span>
              </div>
            </div>

            <div className="mt-14 grid grid-cols-2 md:grid-cols-4 gap-5" style={{ maxWidth: 720, margin: '56px auto 0' }}>
              {[
                ['文字', '札 · 记 · 句'],
                ['影像', '帧 · 流 · 光'],
                ['声音', '声 · 息 · 现'],
                ['地图', '地 · 路 · 痕']
              ].map(([name, sub], i) => (
                <div key={i} style={{
                  padding: '20px 12px',
                  border: '1px solid var(--ink-line)',
                  background: 'var(--bg-deep)'
                }}>
                  <div className="serif-display" style={{ fontSize: 22, fontStyle: 'italic' }}>{name}</div>
                  <div className="chapter-tag mt-2" style={{ color: 'var(--ink-faded)', fontSize: 9 }}>{sub}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* === PERKS === */
    function PerksSection() {
      const [ref, visible] = useReveal();
      return (
        <section
          id="subscribe"
          ref={ref}
          style={{
            padding: 'clamp(60px, 10vw, 140px) clamp(28px, 4vw, 56px)',
            background: 'var(--bg-deep)',
            borderTop: '1px solid var(--ink-line)'
          }}
        >
          <div style={{ maxWidth: 1240, margin: '0 auto' }}>
            <header className={`fade-in ${visible ? 'visible' : ''}`} style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: 32, alignItems: 'end', marginBottom: 'clamp(40px, 6vw, 80px)' }}>
              <div style={{ gridColumn: 'span 12' }} className="md:col-span-7">
                <div className="chapter-tag mb-4" style={{ color: 'var(--accent)' }}>—  订阅 · SUBSCRIBE  —</div>
                <h2 className="serif-display" style={{
                  fontSize: 'clamp(36px, 5.4vw, 76px)',
                  lineHeight: 1.05,
                  letterSpacing: '-0.015em',
                  margin: 0,
                  fontWeight: 400
                }}>
                  成为你自己作品宇宙的<br/><span style={{ fontStyle: 'italic', color: 'var(--accent)' }}>同行者</span>
                </h2>
              </div>
              <p style={{ gridColumn: 'span 12', fontSize: 15, color: 'var(--ink-secondary)', lineHeight: 1.85, maxWidth: 460 }} className="md:col-span-5">
                这是一个可重新填充的沉浸式档案页：你可以放入自己的文字、图像、声音、视频、地图和会员内容。它是房子，也是钥匙。
              </p>
            </header>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', borderTop: '1px solid var(--ink-line)', borderLeft: '1px solid var(--ink-line)' }}>
              {PERKS.map((perk, i) => (
                <article
                  key={perk.no}
                  className={`perk-card fade-in ${visible ? 'visible' : ''}`}
                  style={{
                    padding: 'clamp(28px, 3vw, 44px)',
                    borderRight: '1px solid var(--ink-line)',
                    borderBottom: '1px solid var(--ink-line)',
                    transitionDelay: `${i * 140}ms`,
                    minHeight: 380,
                    display: 'flex',
                    flexDirection: 'column',
                    justifyContent: 'space-between'
                  }}
                >
                  <div>
                    <div className="flex items-baseline justify-between mb-8">
                      <span className="perk-numeral serif-display" style={{ fontSize: 56, lineHeight: 1, fontStyle: 'italic', color: 'var(--ink-faded)' }}>{perk.no}</span>
                      <span className="chapter-tag">— {perk.kicker}</span>
                    </div>
                    <h3 className="serif-display" style={{ fontSize: 'clamp(24px, 2.2vw, 32px)', lineHeight: 1.2, margin: '0 0 16px', fontWeight: 400 }}>
                      {perk.title}
                    </h3>
                    <p style={{ fontSize: 14.5, color: 'var(--ink-secondary)', lineHeight: 1.85, margin: 0 }}>
                      {perk.body}
                    </p>
                  </div>
                  <div className="mt-8 pt-5" style={{ borderTop: '1px dashed var(--ink-line)' }}>
                    <div className="flex flex-wrap gap-x-3 gap-y-2 chapter-tag" style={{ color: 'var(--ink-faded)' }}>
                      {perk.meta.map(m => <span key={m}>· {m}</span>)}
                    </div>
                  </div>
                </article>
              ))}
            </div>

            <div className="mt-14 flex flex-col md:flex-row items-center justify-between gap-6" style={{ padding: 'clamp(24px, 3vw, 36px)', border: '1px solid var(--ink-primary)', background: 'var(--bg-base)' }}>
              <div>
                <div className="chapter-tag mb-2" style={{ color: 'var(--accent)' }}>同行 · ACCESS</div>
                <p className="serif-display" style={{ fontSize: 'clamp(20px, 2vw, 28px)', margin: 0, fontStyle: 'italic' }}>
                  推开门，把你的美放进来。
                </p>
              </div>
              <div className="flex items-center gap-3">
                <input
                  placeholder="name@yours.cn"
                  className="sans"
                  style={{
                    background: 'transparent',
                    border: 'none',
                    borderBottom: '1px solid var(--ink-primary)',
                    padding: '10px 4px',
                    fontSize: 14,
                    color: 'var(--ink-primary)',
                    width: 220,
                    outline: 'none'
                  }}
                />
                <button
                  className="sans"
                  style={{
                    background: 'var(--ink-primary)',
                    color: 'var(--bg-base)',
                    border: 'none',
                    padding: '12px 22px',
                    fontSize: 11,
                    letterSpacing: '0.24em',
                    textTransform: 'uppercase',
                    cursor: 'pointer',
                    transition: 'background 0.3s ease'
                  }}
                  onMouseEnter={e => e.currentTarget.style.background = 'var(--accent)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'var(--ink-primary)'}
                >
                  进入档案
                </button>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* === FOOTER === */
    function FooterSection() {
      return (
        <footer id="colophon" style={{ padding: 'clamp(40px, 6vw, 72px) clamp(28px, 4vw, 56px)', borderTop: '1px solid var(--ink-line)', background: 'var(--bg-base)' }}>
          <div style={{ maxWidth: 1240, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 32 }}>
            <div>
              <div className="serif-display" style={{ fontSize: 28, letterSpacing: '-0.01em' }}>山夏<span style={{ color: 'var(--accent)', fontStyle: 'italic' }}>.Skill</span></div>
              <p className="mt-3" style={{ fontSize: 13, color: 'var(--ink-secondary)', lineHeight: 1.75, maxWidth: 280 }}>
                未竟之美，永不止息。一座可被重新填充的私人档案。
              </p>
            </div>
            <div>
              <div className="chapter-tag mb-4">章节</div>
              <ul className="space-y-2 sans" style={{ fontSize: 13, color: 'var(--ink-secondary)', listStyle: 'none', padding: 0, margin: 0 }}>
                <li>壹 · 美是未竟的</li>
                <li>贰 · 美永不止息</li>
                <li>叁 · 私人档案</li>
              </ul>
            </div>
            <div>
              <div className="chapter-tag mb-4">载体</div>
              <ul className="space-y-2 sans" style={{ fontSize: 13, color: 'var(--ink-secondary)', listStyle: 'none', padding: 0, margin: 0 }}>
                <li>文字 · 笔记</li>
                <li>影像 · 声音</li>
                <li>地图 · 路径</li>
              </ul>
            </div>
            <div>
              <div className="chapter-tag mb-4">版本信息</div>
              <p className="sans" style={{ fontSize: 12, color: 'var(--ink-faded)', lineHeight: 1.8 }}>
                第 I 卷 · MMXXVI<br/>
                字面 Cormorant Garamond × Noto Serif SC<br/>
                © 山夏私人档案
              </p>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      const [tweaks, setTweaks] = useState(loadTweaks());
      useEffect(() => {
        saveTweaks(tweaks);
        document.body.dataset.mode = tweaks.mode;
        document.body.dataset.veil = tweaks.veil;
        document.documentElement.style.setProperty(
          '--serif-body',
          tweaks.typeface === 'songti'
            ? "'Noto Serif SC', serif"
            : "'Cormorant Garamond', 'Noto Serif SC', serif"
        );
        document.documentElement.style.setProperty(
          '--serif-display',
          tweaks.typeface === 'songti'
            ? "'Noto Serif SC', serif"
            : "'Cormorant Garamond', 'Noto Serif SC', serif"
        );
      }, [tweaks]);

      function scrollToBook() {
        const el = document.getElementById('book');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }

      return (
        <div className="relative" id="top">
          <TweaksPanel tweaks={tweaks} onChange={setTweaks} />
          <NavBar onBook={scrollToBook} />

          {/* ===== 诗意三连屏(保留原始叙事) ===== */}
          <HeroSection />
          <VerseSection verse={VERSE_ONE} variant="left" />
          <VerseSection verse={VERSE_TWO} variant="right" />

          {/* ===== 私人灵感档案(过渡屏) ===== */}
          <LoadingSection />

          {/* ===== 摄影业务模块 ===== */}
          <WorksSection />
          <ProofSection />
          <AboutSection />
          <PricingSection onBook={scrollToBook} />
          <VoicesSection />
          <BookSection />

          {/* ===== 订阅档案(同行者) ===== */}
          <PerksSection />

          <BizFooter />
          <button className="float-cta" onClick={scrollToBook}>预约一次拍摄 →</button>
          <div className="scroll-cue">SCROLL — 沿章而下</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
